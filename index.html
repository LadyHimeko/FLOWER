
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bloom</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="garden">

        <!-- Soft background light -->
        <div class="moon-glow"></div>

        <!-- Flower -->
        <div class="flower">

            <!-- Outer petals -->
            <div class="petal outer p1"></div>
            <div class="petal outer p2"></div>
            <div class="petal outer p3"></div>
            <div class="petal outer p4"></div>
            <div class="petal outer p5"></div>
            <div class="petal outer p6"></div>
            <div class="petal outer p7"></div>
            <div class="petal outer p8"></div>

            <!-- Middle petals -->
            <div class="petal middle p9"></div>
            <div class="petal middle p10"></div>
            <div class="petal middle p11"></div>
            <div class="petal middle p12"></div>
            <div class="petal middle p13"></div>
            <div class="petal middle p14"></div>
            <div class="petal middle p15"></div>
            <div class="petal middle p16"></div>

            <!-- Inner petals -->
            <div class="petal inner p17"></div>
            <div class="petal inner p18"></div>
            <div class="petal inner p19"></div>
            <div class="petal inner p20"></div>
            <div class="petal inner p21"></div>
            <div class="petal inner p22"></div>

            <!-- Flower center -->
            <div class="flower-center">
                <div class="pollen"></div>
                <div class="pollen"></div>
                <div class="pollen"></div>
                <div class="pollen"></div>
                <div class="pollen"></div>
                <div class="pollen"></div>
                <div class="pollen"></div>
                <div class="pollen"></div>
            </div>

            <!-- Stem -->
            <div class="stem"></div>

            <!-- Leaves -->
            <div class="leaf left"></div>
            <div class="leaf right"></div>

        </div>

        <!-- Message -->
        <div class="message">
            <h1>Bloom</h1>
            <p>Even the most beautiful things take time to unfold.</p>
        </div>

    </main>

</body>
</html>
